services:
  db:
    image: postgres:17-alpine
    container_name: dataconform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataconform
      POSTGRES_USER: dataconform_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataconform_user -d dataconform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataconform_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=dataconform;Username=dataconform_user;Password=${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      Jwt__Secret: ${JWT_SECRET:?Defina JWT_SECRET (min 32 chars) no arquivo .env}
      Jwt__Issuer: DataConform
      Jwt__Audience: DataConform
      Admin__ApiKey: ${ADMIN_API_KEY:-}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-https://dataconform.com.br,https://www.dataconform.com.br}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__ProPriceId: ${STRIPE_PRO_PRICE_ID:-}
      Stripe__EnterprisePriceId: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      Support__Email: ${SUPPORT_EMAIL:-}
      Database__AutoMigrate: "true"
    volumes:
      - backend_storage:/app/storage/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_STRIPE_PRO_URL: ${VITE_STRIPE_PRO_URL:-}
        VITE_STRIPE_ENTERPRISE_URL: ${VITE_STRIPE_ENTERPRISE_URL:-}
    container_name: dataconform_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_storage:
