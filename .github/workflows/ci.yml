name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore backend/DataConform.sln

      - name: Build solution (Release)
        run: dotnet build backend/DataConform.sln --no-restore --configuration Release

      - name: Run automated unit tests
        run: dotnet test backend/DataConform.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend (React 19 + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production bundle & programmatic SEO
        run: npm run build
