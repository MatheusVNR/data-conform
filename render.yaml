services:
  # Backend API (.NET 10 Web Service via Docker)
  - type: web
    name: dataconform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: dataconform-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: dataconform-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Cors__AllowedOrigins
        value: "*"

  # Frontend (React 19 Static Site)
  # Observação: Static sites no Render rodam direto no CDN global e não usam a propriedade 'plan'
  - type: web
    name: dataconform-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: dataconform-db
    databaseName: dataconform
    user: dataconform
    plan: free
