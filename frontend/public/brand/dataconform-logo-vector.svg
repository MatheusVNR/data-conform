<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dcBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="dStroke" x1="12" y1="14" x2="36" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="cCheck" x1="26" y1="18" x2="54" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Squircle Emblem Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#dcBg)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" stroke="#60A5FA" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Letter "D" Structured Data Spine + Curve -->
  <path
    d="M15 17H24.5C32.5 17 38 22.8 38 32C38 41.2 32.5 47 24.5 47H15V17Z"
    stroke="url(#dStroke)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Data Bars inside "D" -->
  <line x1="20.5" y1="25" x2="27" y2="25" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <line x1="20.5" y1="32" x2="29.5" y2="32" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <line x1="20.5" y1="39" x2="25" y2="39" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />

  <!-- Interlocking Letter "C" morphing into Conformity Checkmark -->
  <path
    d="M44 21.5C40.8 18.8 36.2 18.8 33 21.5C28.8 25.2 28.8 38.8 33 42.5C36.5 45.5 41.5 45.2 45 41.5"
